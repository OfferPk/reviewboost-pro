<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <style>
      .acrylic-base { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .stand-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 20; filter: drop-shadow(0 15px 35px rgba(0,0,0,0.15)); }
      .logo-box { fill: #0891b2; rx: 12; }
      .logo-txt { font-family: -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .title-txt { font-family: -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .sub-txt { font-family: -apple-system, sans-serif; font-size: 15px; fill: #64748b; text-anchor: middle; font-weight: 500; }
      .stars { font-family: sans-serif; font-size: 32px; fill: #f59e0b; text-anchor: middle; letter-spacing: 4px; }
      .cta-head { font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .cta-desc { font-family: -apple-system, sans-serif; font-size: 14px; fill: #475569; text-anchor: middle; }
      .reward-pill { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.5; rx: 8; }
      .reward-txt { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #b45309; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="#0b0f19" />

  <!-- Acrylic Stand Holder Shadow & Base -->
  <polygon points="160,1020 640,1020 680,1060 120,1060" fill="rgba(0,0,0,0.4)" />
  <rect class="acrylic-base" x="140" y="1010" width="520" height="40" />

  <!-- The Countertop Card (Inserted in Stand) -->
  <rect class="stand-card" x="160" y="80" width="480" height="920" />

  <!-- Brand Logo Badge -->
  <rect class="logo-box" x="365" y="140" width="70" height="70" />
  <text class="logo-txt" x="400" y="175">AD</text>

  <!-- Business Name & Location -->
  <text class="title-txt" x="400" y="250">Apex Dental &amp; Aesthetics Clinic</text>
  <text class="sub-txt" x="400" y="278">Dubai Healthcare City • Building 64</text>

  <!-- 5 Gold Stars Visual -->
  <text class="stars" x="400" y="335">★★★★★</text>

  <!-- Vector QR Code Box with Authentic Matrix Design -->
  <g transform="translate(260, 370)">
    <rect width="280" height="280" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="16" />
    
    <!-- QR Finder 1 (Top-Left) -->
    <rect x="25" y="25" width="60" height="60" fill="#0f172a" rx="4" />
    <rect x="35" y="35" width="40" height="40" fill="#f8fafc" rx="2" />
    <rect x="43" y="43" width="24" height="24" fill="#0f172a" rx="2" />

    <!-- QR Finder 2 (Top-Right) -->
    <rect x="195" y="25" width="60" height="60" fill="#0f172a" rx="4" />
    <rect x="205" y="35" width="40" height="40" fill="#f8fafc" rx="2" />
    <rect x="213" y="43" width="24" height="24" fill="#0f172a" rx="2" />

    <!-- QR Finder 3 (Bottom-Left) -->
    <rect x="25" y="195" width="60" height="60" fill="#0f172a" rx="4" />
    <rect x="35" y="205" width="40" height="40" fill="#f8fafc" rx="2" />
    <rect x="43" y="213" width="24" height="24" fill="#0f172a" rx="2" />

    <!-- QR Matrix Patterns -->
    <rect x="95" y="30" width="10" height="10" fill="#0f172a" />
    <rect x="115" y="30" width="10" height="10" fill="#0f172a" />
    <rect x="135" y="30" width="10" height="10" fill="#0f172a" />
    <rect x="155" y="30" width="10" height="10" fill="#0f172a" />
    <rect x="175" y="30" width="10" height="10" fill="#0f172a" />

    <rect x="95" y="60" width="20" height="10" fill="#0f172a" />
    <rect x="140" y="60" width="30" height="10" fill="#0f172a" />

    <rect x="30" y="95" width="10" height="20" fill="#0f172a" />
    <rect x="30" y="135" width="10" height="30" fill="#0f172a" />
    <rect x="30" y="175" width="10" height="10" fill="#0f172a" />

    <rect x="60" y="105" width="30" height="20" fill="#0f172a" />
    <rect x="105" y="105" width="20" height="20" fill="#0f172a" />
    <rect x="140" y="105" width="40" height="20" fill="#0f172a" />
    <rect x="200" y="105" width="30" height="20" fill="#0f172a" />

    <rect x="80" y="140" width="40" height="20" fill="#0f172a" />
    <rect x="140" y="140" width="20" height="40" fill="#0f172a" />
    <rect x="180" y="140" width="40" height="20" fill="#0f172a" />

    <rect x="100" y="195" width="20" height="30" fill="#0f172a" />
    <rect x="140" y="200" width="40" height="20" fill="#0f172a" />
    <rect x="200" y="200" width="40" height="40" fill="#0f172a" />
    <rect x="100" y="240" width="30" height="20" fill="#0f172a" />
    <rect x="150" y="235" width="30" height="20" fill="#0f172a" />
  </g>

  <!-- CTA Heading -->
  <text class="cta-head" x="400" y="700">Scan to Rate Your Visit / امسح الرمز للتقييم</text>
  <text class="cta-desc" x="400" y="730">Your feedback helps us deliver world-class patient care.</text>

  <!-- Customer Reward Pill -->
  <rect class="reward-pill" x="210" y="780" width="380" height="44" />
  <text class="reward-txt" x="400" y="802">★ REWARD: Show code CARE15 for 15% off your next visit</text>

  <!-- Footer Powered -->
  <text font-family="sans-serif" font-size="11" fill="#94a3b8" x="400" y="880" text-anchor="middle">Powered by ReviewBoost Pro • Fast Contactless Feedback</text>
</svg>
